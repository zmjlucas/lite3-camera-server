name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.11'
          - os: ubuntu-22.04
            python: '3.14'
          - os: macos-15
            python: '3.13'
          - os: windows-2022
            python: '3.8'
          - os: windows-2022
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run syntax checks and offline tests
        run: python -B scripts/check.py
      - name: Check remote Bash syntax
        if: runner.os != 'Windows'
        run: python -B scripts/check.py --syntax-only --shell
      - name: Check server syntax for Python 3.6
        if: matrix.python == '3.8'
        run: python -B scripts/check.py --device-syntax

  sdk:
    name: Installed SDK and contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install development checks
        run: python -m pip install '.[dev]'
      - name: Check installed SDK types and simulated HTTP contract
        run: python -B scripts/check_distribution.py
      - name: Check browser client command contracts
        run: node tests/dev_client_test.js

  browser:
    name: Browser smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check playback and reconnection
        run: python -B tests/camera_browser_smoke.py
      - name: Check camera source selection
        run: python -B tests/camera_sources_browser_smoke.py
      - name: Check development console safety controls
        run: python -B tests/dev_browser_smoke.py
