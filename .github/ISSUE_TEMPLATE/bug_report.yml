name: Bug report
description: Report a camera preview problem with steps to reproduce it
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Give the client OS and Python version, perception host environment, camera model, backend, and commit ID.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the commands and steps to reproduce the problem. Remove credentials and private information.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and test conditions
      description: Include relevant errors or /healthz output. State whether the issue occurred in an offline test or with a real camera.
