<script>
// Observe response identity without changing requests, response bodies or decoding.
let testStreamAttempt = 0;
let navigating = false;
const originalFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const response = await originalFetch(...args);
  if (args[0] === '/stream.mjpg') testStreamAttempt = Number(response.headers.get('X-Test-Stream'));
  return response;
};
setInterval(async () => {
  if (navigating) return;
  const row = {
    time: performance.now(), hidden: document.getElementById('stream').hidden,
    width: document.getElementById('stream').naturalWidth, hash: location.hash,
    reloaded: sessionStorage.getItem('test-reloaded') === 'yes',
    attempt: testStreamAttempt,
    snapshot: document.getElementById('snapshot').href.startsWith('blob:'),
    source: document.querySelector('.source').textContent,
    alt: document.getElementById('stream').alt,
    status: document.getElementById('status').textContent};
  await fetch('/observe', {method: 'POST', body: JSON.stringify(row)});
  if (row.attempt === 4 && row.status === 'Live' && !sessionStorage.getItem('test-reloaded')) {
    navigating = true;
    sessionStorage.setItem('test-reloaded', 'yes');
    location.reload();

  }
}, 100);
</script>
